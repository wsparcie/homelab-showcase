# /etc/systemd/system/hermes-gateway.service.d/hardening.conf
# The agent - and every command its terminal tool runs (same mount namespace) - cannot rewrite its own
# config, code, persona, hooks or secrets, and cannot gain privileges. Config edits and upgrades are done
# from an admin shell outside the service, followed by a restart.
[Service]
NoNewPrivileges=yes
ReadOnlyPaths=/home/hermes/.hermes/config.yaml /home/hermes/.hermes/.env /home/hermes/.hermes/SOUL.md /home/hermes/.hermes/hooks /home/hermes/.hermes/hermes-agent /home/hermes/.local/bin /home/hermes/.hermes/auth.json
