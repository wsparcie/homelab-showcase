# In the frontend's nginx server block. The visitor's address comes from the CDN header, but only when the request
# arrives from a private address (the reverse proxy, the connector or the Docker network). Without the header, for
# example direct access from the LAN, $remote_addr stays as it is.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

location /api/ {
    proxy_pass http://backend:5001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite instead of append: the backend trusts exactly one hop (this nginx) and must not see
    # X-Forwarded-For values the client made up.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
