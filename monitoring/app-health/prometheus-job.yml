# Prometheus scrape job: the target file chooses the module per group through the "module" label.
- job_name: blackbox-health
  metrics_path: /probe
  scrape_interval: 60s
  file_sd_configs:
    - files: [/etc/prometheus/targets/blackbox-health.yml]
  relabel_configs:
    - { source_labels: [module], target_label: __param_module }
    - { source_labels: [__address__], target_label: __param_target }
    - { source_labels: [__param_target], target_label: instance }
    - { target_label: __address__, replacement: blackbox:9115 }
