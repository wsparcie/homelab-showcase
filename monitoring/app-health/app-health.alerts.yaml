# App health probes through NPM (Prometheus job blackbox-health, targets in prometheus/targets/blackbox-health.yml).
# Unlike the reachability probes (job blackbox-http, any status accepted), these need a real answer from the backend.
apiVersion: 1

groups:
  - orgId: 1
    name: app-health
    folder: Homelab
    interval: 1m
    rules:
      - uid: app-health-failing
        title: 'App health check failing'
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: PROMETHEUS_DATASOURCE_UID
            model:
              refId: A
              expr: 'probe_success{job="blackbox-health"}'
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Health check failing for 5 min: {{ $labels.instance }} (module {{ $labels.module }}). The app or its backend is not answering correctly behind NPM.'
        isPaused: false
